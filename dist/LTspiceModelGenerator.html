<body><main><header><p class="eyebrow">DATASHEET TO SIMULATION</p><h1>LTspice Model Package Generator</h1><p>SPICEモデル、専用シンボル、検証回路をひとつのZIPにまとめます。</p></header>
<section class="panel"><form id="model-form">
<label>Device name<input id="device-name" value="PC817" required pattern="[A-Za-z0-9_.-]+"></label>
<div class="model-field"><span class="field-label">Device / model</span><div id="model-picker" class="model-picker"><button type="button" id="model-picker-button" class="model-picker-button" aria-haspopup="dialog" aria-expanded="false"></button><div id="model-picker-popover" class="model-picker-popover" role="dialog" aria-label="Device model selection" hidden><div id="model-picker-options" class="model-picker-options" role="listbox" aria-label="Device models"></div><div id="model-preview" class="model-preview" aria-live="polite"></div></div></div><select id="variant" class="native-model-select" aria-hidden="true" tabindex="-1"></select></div>
<label>Temperature (°C)<input id="temperature" type="number" value="27"></label>
<div class="wide section-title"><h2>Characteristic data</h2><p>データシートのグラフから読み取った点をCSVで入力してください。</p></div>
<div id="characteristic-fields" class="wide characteristic-grid"></div>
<div class="wide fit-result"><button type="button" id="fit-button" class="secondary">Fit model parameters</button><output id="fit-output">未フィッティング</output></div>
<label class="wide">Parameter overrides (JSON)<textarea id="parameters" rows="4">{}</textarea><small>自動推定値を変更する場合だけ指定します。</small></label>

</form></section><section class="contents"><h2>Package contents</h2><code>DEVICE.lib · DEVICE.asy · DEVICE_test.asc · model.json · README.txt</code></section></main><script>
(function () {
"use strict";

// src/model/deviceModel.js
const DEFINITIONS = {
  Diode: { modelType: "MODEL", polarity: "D", prefix: "D", pins: ["A", "K"] },
  "BJT-NPN": { modelType: "MODEL", polarity: "NPN", prefix: "Q", pins: ["C", "B", "E"] },
  "BJT-PNP": { modelType: "MODEL", polarity: "PNP", prefix: "Q", pins: ["C", "B", "E"] },
  "MOSFET-NMOS-Basic": { modelType: "MODEL", polarity: "NMOS", prefix: "M", pins: ["D", "G", "S"] },
  "MOSFET-PMOS-Basic": { modelType: "MODEL", polarity: "PMOS", prefix: "M", pins: ["D", "G", "S"] },
  "MOSFET-NMOS-Advanced": { modelType: "SUBCKT", polarity: "NMOS", prefix: "X", pins: ["D", "G", "S"] },
  "MOSFET-PMOS-Advanced": { modelType: "SUBCKT", polarity: "PMOS", prefix: "X", pins: ["D", "G", "S"] },
  PhotoCoupler: { modelType: "SUBCKT", polarity: "PhotoCoupler", prefix: "X", pins: ["A", "K", "C", "E"] }
};

const deviceOptions = Object.keys(DEFINITIONS);

function createDeviceModel(input) {
  const definition = DEFINITIONS[input.variant];
  if (!definition) throw new Error(`Unsupported device variant: ${input.variant}`);
  const deviceName = String(input.deviceName || "").trim().replace(/[^A-Za-z0-9_.-]/g, "_");
  if (!deviceName) throw new Error("Device name is required.");
  const deviceType = input.variant.startsWith("BJT") ? "BJT"
    : input.variant.startsWith("MOSFET") ? "MOSFET" : input.variant;
  return {
    schemaVersion: 1,
    deviceName,
    deviceType,
    variant: input.variant,
    modelType: definition.modelType,
    polarity: definition.polarity,
    symbolPrefix: definition.prefix,
    symbolBase: input.variant === "Diode" ? "diode"
      : input.variant === "BJT-NPN" ? "npn"
      : input.variant === "BJT-PNP" ? "pnp"
      : input.variant.includes("NMOS") ? "nmos"
      : input.variant.includes("PMOS") ? "pmos" : "opto-coupler",
    pins: definition.pins.map((name, index) => ({ name, spiceOrder: index + 1 })),
    spiceParameters: { ...(input.spiceParameters || {}) },
    characteristicCurves: input.characteristicCurves || [],
    temperature: Number.isFinite(Number(input.temperature)) ? Number(input.temperature) : 27,
    fittingError: input.fittingError ?? null,
    fittingWarnings: input.fittingWarnings || [],
    parameterSources: input.parameterSources || {},
    generatedAt: input.generatedAt || new Date().toISOString(),
    generatorVersion: input.generatorVersion || "1.0.0"
  };
}

function assertDeviceModel(model) {
  if (!model.deviceName || !model.modelType || !Array.isArray(model.pins)) throw new Error("Invalid common model data.");
  model.pins.forEach((pin, index) => {
    if (!pin.name || pin.spiceOrder !== index + 1) throw new Error("pins must have contiguous SpiceOrder values starting at 1.");
  });
  return model;
}

// src/model/characteristicFitter.js
const VT_27 = 0.0256926;
const BOLTZMANN_EV = 8.617333262e-5;

// This is the single source of truth for datasheet-to-SPICE correspondence.
// `stage` controls whether a fit is always attempted or only when data exists.
const parameterMappings = {
  Diode: [
    { key: "iv", stage: "basic", characteristic: "IF-VF", parameters: ["IS", "N", "RS"] },
    { key: "cjVr", stage: "capacitance", characteristic: "Cj-VR", parameters: ["CJO", "VJ", "M"] },
    { key: "temperatureIv", stage: "temperature", characteristic: "IF-VF @ multiple temperatures", parameters: ["EG", "XTI", "TNOM"] },
    { key: "reverseRecovery", stage: "switching", characteristic: "Reverse recovery", parameters: ["TT"] }
  ],
  BJT: [
    { key: "vbeIc", stage: "basic", characteristic: "VBE-IC", parameters: ["IS", "N"] },
    { key: "gummel", stage: "basic", characteristic: "Gummel VBE-IC-IB", parameters: ["IS", "N", "BF"] },
    { key: "hfeIc", stage: "basic", characteristic: "hFE-IC", parameters: ["BF", "IKF"] },
    { key: "icIb", stage: "basic", characteristic: "IC-IB", parameters: ["BF"] },
    { key: "junctionCapacitance", stage: "capacitance", characteristic: "CJC-VCB", parameters: ["CJC", "VJC", "MJC"] },
    { key: "temperatureIc", stage: "temperature", characteristic: "VBE-IC @ multiple temperatures", parameters: ["EG", "XTI", "TNOM"] },
    { key: "transitionFrequency", stage: "switching", characteristic: "fT-IC", parameters: ["TF"] }
  ],
  MOSFET: [
    { key: "transfer", stage: "basic", characteristic: "VGS-ID", parameters: ["VTO", "KP"] },
    { key: "outputCapacitance", stage: "capacitance", characteristic: "CISS/COSS/CRSS-VDS", parameters: ["CGS", "CGD", "CBD"] },
    { key: "temperatureTransfer", stage: "temperature", characteristic: "VGS-ID @ multiple temperatures", parameters: ["VTO", "KP", "TCV", "BEX", "TNOM"] },
    { key: "gateCharge", stage: "switching", characteristic: "QG-VGS", parameters: ["CGS"] }
  ],
  PhotoCoupler: [
    { key: "ifCtr", stage: "basic", characteristic: "IF-CTR", parameters: ["CTR"] },
    { key: "transfer", stage: "basic", characteristic: "IF-IC", parameters: ["CTR"] },
    { key: "led", stage: "basic", characteristic: "LED IF-VF", parameters: ["IS", "N", "RS"] },
    { key: "couplingCapacitance", stage: "capacitance", characteristic: "CCE-VCE", parameters: ["CCE"] },
    { key: "temperatureCtr", stage: "temperature", characteristic: "IF-CTR @ multiple temperatures", parameters: ["CTRTC", "TNOM"] },
    { key: "responseTime", stage: "switching", characteristic: "tr/tf-RL", parameters: ["CCE"] }
  ]
};

function parseCsvPoints(text, columns) {
  const numericTokens = String(text || "")
    .replace(/^\uFEFF/, "")
    .split(/\r?\n/)
    .map(line => line.replace(/#.*$/, "").trim())
    .filter(Boolean)
    .flatMap(line => {
      const rawTokens = line.replace(/[\u3000,;]+/g, " ").trim().split(/\s+/).filter(Boolean);
      const values = rawTokens.map(token => Number(token.replace(/[dD]([+-]?\d+)$/, "e$1")));
      // Ignore complete header, unit and annotation lines instead of allowing
      // their text to shift the following numeric column alignment.
      return values.every(Number.isFinite) ? values : [];
    });

  if (numericTokens.length % columns.length !== 0) {
    throw new Error(`特性データは${columns.length}列単位で入力してください（数値${numericTokens.length}個を検出）。`);
  }

  const points = [];
  for (let index = 0; index < numericTokens.length; index += columns.length) {
    points.push(Object.fromEntries(columns.map((column, offset) => [column, numericTokens[index + offset]])));
  }
  if (points.length < 2) throw new Error("フィッティングには2点以上の特性データが必要です。");
  return points;
}

function parseTemperatureList(value) {
  return String(value || "")
    .replace(/[℃°Cc]/g, " ")
    .split(/[\s,;]+/)
    .filter(Boolean)
    .map(Number);
}

function unitScale(unit) {
  return { A: 1, mA: 1e-3, uA: 1e-6, "µA": 1e-6, "μA": 1e-6 }[unit] ?? 1;
}

// Accept either long rows (TEMP, X, Y) or graph-tool-style wide rows
// (X, Y1, Y2...). Tabs are significant because blank Y cells are missing data.
function parseTemperaturePoints(text, options) {
  const {
    xKey,
    yKey,
    temperatures: temperatureInput,
    yUnit = "A"
  } = options;
  const lines = String(text || "")
    .replace(/^\uFEFF/, "")
    .split(/\r?\n/)
    .map(line => line.replace(/#.*$/, ""))
    .filter(line => line.trim());
  const firstLine = lines[0] || "";
  const headerTemperatures = [...firstLine.matchAll(/(-?\d+(?:\.\d+)?)\s*(?:°\s*C|℃|C)\b/gi)]
    .map(match => Number(match[1]));
  const suppliedTemperatures = parseTemperatureList(temperatureInput);
  const hasWideHeader = /(^|\s)X(?:\s|$)/i.test(firstLine) || /Y\d+/i.test(firstLine);
  const isWide = suppliedTemperatures.length > 0 || headerTemperatures.length > 0 || hasWideHeader;
  const scale = unitScale(yUnit);

  if (!isWide) {
    return parseCsvPoints(text, ["TEMP", xKey, yKey]).map(point => ({
      ...point,
      [yKey]: point[yKey] * scale
    }));
  }

  const temperatures = suppliedTemperatures.length ? suppliedTemperatures : headerTemperatures;
  if (temperatures.length < 2) {
    throw new Error("横持ち温度データには、Y1以降に対応する温度を2つ以上指定してください。");
  }

  const points = [];
  for (const line of lines) {
    const cells = line.includes("\t")
      ? line.split("\t").map(cell => cell.trim())
      : line.split(",").map(cell => cell.trim());
    const x = Number(cells[0]);
    if (!Number.isFinite(x)) continue; // Header row.

    temperatures.forEach((temperature, index) => {
      const rawY = cells[index + 1];
      if (rawY == null || rawY === "") return;
      const y = Number(rawY.replace(/[dD]([+-]?\d+)$/, "e$1"));
      if (!Number.isFinite(y)) return;
      points.push({ TEMP: temperature, [xKey]: x, [yKey]: y * scale });
    });
  }
  if (points.length < 4) throw new Error("温度フィッティングには有効な測定点が不足しています。");
  return points;
}

function swapSeriesXY(text, columnCount = 2) {
  const values = String(text || "").replace(/[\u3000,;]+/g, " ").trim().split(/\s+/).filter(Boolean);
  if (values.length % columnCount !== 0) return text;

  const rows = [];
  for (let index = 0; index < values.length; index += columnCount) {
    const row = values.slice(index, index + columnCount);
    [row[0], row[1]] = [row[1], row[0]];
    rows.push(row.join(" "));
  }
  return rows.join("\n");
}

const hasData = value => String(value || "")
  .split(/\r?\n/)
  .some(line => line.trim() && !line.trim().startsWith("#"));

function format(value) {
  if (!Number.isFinite(value)) throw new Error("有効なパラメータを求められませんでした。");
  return Number(value.toPrecision(7)).toString();
}

function median(values) {
  const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
  if (!sorted.length) throw new Error("有効なOptional Parameterを求められませんでした。");
  const middle = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
}

function groupBy(points, key) {
  const groups = new Map();
  for (const point of points) {
    const value = point[key];
    if (!groups.has(value)) groups.set(value, []);
    groups.get(value).push(point);
  }
  return groups;
}

function linearFit(points) {
  const n = points.length;
  const sx = points.reduce((sum, point) => sum + point.x, 0);
  const sy = points.reduce((sum, point) => sum + point.y, 0);
  const sxx = points.reduce((sum, point) => sum + point.x * point.x, 0);
  const sxy = points.reduce((sum, point) => sum + point.x * point.y, 0);
  const denominator = n * sxx - sx * sx;
  if (Math.abs(denominator) < 1e-20) throw new Error("同じX値だけではフィッティングできません。");

  const slope = (n * sxy - sx * sy) / denominator;
  const intercept = (sy - slope * sx) / n;
  const rmse = Math.sqrt(points.reduce((sum, point) => {
    return sum + (point.y - (slope * point.x + intercept)) ** 2;
  }, 0) / n);
  return { slope, intercept, rmse };
}

function solveLinearSystem(matrix, vector) {
  const size = vector.length;
  const augmented = matrix.map((row, index) => [...row, vector[index]]);

  for (let column = 0; column < size; column += 1) {
    let pivot = column;
    for (let row = column + 1; row < size; row += 1) {
      if (Math.abs(augmented[row][column]) > Math.abs(augmented[pivot][column])) pivot = row;
    }
    [augmented[column], augmented[pivot]] = [augmented[pivot], augmented[column]];
    if (Math.abs(augmented[column][column]) < 1e-20) {
      throw new Error("特性点の組み合わせからパラメータを分離できません。");
    }

    const divisor = augmented[column][column];
    for (let index = column; index <= size; index += 1) augmented[column][index] /= divisor;
    for (let row = 0; row < size; row += 1) {
      if (row === column) continue;
      const factor = augmented[row][column];
      for (let index = column; index <= size; index += 1) {
        augmented[row][index] -= factor * augmented[column][index];
      }
    }
  }
  return augmented.map(row => row[size]);
}

function multipleLinearFit(rows) {
  const width = rows[0].x.length;
  const matrix = Array.from({ length: width }, () => Array(width).fill(0));
  const vector = Array(width).fill(0);
  for (const row of rows) {
    for (let left = 0; left < width; left += 1) {
      vector[left] += row.x[left] * row.y;
      for (let right = 0; right < width; right += 1) {
        matrix[left][right] += row.x[left] * row.x[right];
      }
    }
  }
  const coefficients = solveLinearSystem(matrix, vector);
  const rmse = Math.sqrt(rows.reduce((sum, row) => {
    const predicted = row.x.reduce((value, input, index) => value + input * coefficients[index], 0);
    return sum + (row.y - predicted) ** 2;
  }, 0) / rows.length);
  return { coefficients, rmse };
}

function fitJunction(points, voltageKey, currentKey, temperature) {
  const valid = points
    .filter(point => point[currentKey] > 0)
    .map(point => ({ x: Math.abs(point[voltageKey]), y: Math.log(Math.abs(point[currentKey])) }));
  if (valid.length < 2) throw new Error("接合特性には正の電流値が2点以上必要です。");

  const fit = linearFit(valid);
  const vt = VT_27 * (Number(temperature) + 273.15) / 300.15;
  const ideality = 1 / (fit.slope * vt);
  const saturationCurrent = Math.exp(fit.intercept);

  // High-current deviation from the exponential line estimates series resistance.
  const resistanceCandidates = points
    .filter(point => point[currentKey] > 0)
    .map(point => {
      const idealVoltage = ideality * vt * Math.log(point[currentKey] / saturationCurrent);
      return (Math.abs(point[voltageKey]) - idealVoltage) / point[currentKey];
    })
    .filter(value => value > 0);

  const parameters = { IS: format(saturationCurrent), N: format(ideality) };
  if (resistanceCandidates.length) parameters.RS = format(median(resistanceCandidates));
  return { parameters, error: fit.rmse };
}

function fitDiodeJunction(points, voltageKey, currentKey, temperature) {
  const valid = points.filter(point => point[currentKey] > 0 && Number.isFinite(point[voltageKey]));
  if (valid.length < 3) return fitJunction(points, voltageKey, currentKey, temperature);

  // V = N*VT*ln(I) - N*VT*ln(IS) + I*RS
  const fit = multipleLinearFit(valid.map(point => ({
    x: [Math.log(point[currentKey]), 1, point[currentKey]],
    y: Math.abs(point[voltageKey])
  })));
  const [slope, intercept, resistance] = fit.coefficients;
  const vt = VT_27 * (Number(temperature) + 273.15) / 300.15;
  const ideality = slope / vt;
  const saturationCurrent = Math.exp(-intercept / slope);

  if (ideality <= 0 || saturationCurrent <= 0 || resistance < 0) {
    throw new Error("IF-VFデータから物理的に有効なIS/N/RSを推定できませんでした。単位とデータ範囲を確認してください。");
  }
  return {
    parameters: {
      IS: format(saturationCurrent),
      N: format(ideality),
      RS: format(resistance)
    },
    error: fit.rmse
  };
}

function fitDepletionCapacitance(points, voltageKey, capacitanceKey, names) {
  const valid = points.filter(point => point[capacitanceKey] > 0 && point[voltageKey] >= 0);
  if (valid.length < 2) throw new Error("容量特性には正の容量値が2点以上必要です。");

  let best;
  for (let vj = 0.1; vj <= 2.0; vj += 0.02) {
    for (let grading = 0.1; grading <= 0.9; grading += 0.02) {
      const logCjo = valid.reduce((sum, point) => {
        return sum + Math.log(point[capacitanceKey]) + grading * Math.log(1 + point[voltageKey] / vj);
      }, 0) / valid.length;
      const error = Math.sqrt(valid.reduce((sum, point) => {
        const predicted = logCjo - grading * Math.log(1 + point[voltageKey] / vj);
        return sum + (Math.log(point[capacitanceKey]) - predicted) ** 2;
      }, 0) / valid.length);
      if (!best || error < best.error) best = { cjo: Math.exp(logCjo), vj, grading, error };
    }
  }

  return {
    parameters: {
      [names.capacitance]: format(best.cjo),
      [names.potential]: format(best.vj),
      [names.grading]: format(best.grading)
    },
    error: best.error
  };
}

function fitTemperatureJunction(points, voltageKey, currentKey, nominalTemperature) {
  const groups = groupBy(points, "TEMP");
  if (groups.size < 2) throw new Error("温度特性は2温度以上のデータを入力してください。");

  const samples = [...groups].map(([temperature, group]) => {
    const junction = fitJunction(group, voltageKey, currentKey, temperature);
    return { temperature, is: Number(junction.parameters.IS), n: Number(junction.parameters.N) };
  });
  const reference = samples.reduce((best, sample) => (
    Math.abs(sample.temperature - nominalTemperature) < Math.abs(best.temperature - nominalTemperature) ? sample : best
  ));
  const nominalK = reference.temperature + 273.15;
  const rows = samples.filter(sample => sample !== reference).map(sample => ({
    x1: Math.log((sample.temperature + 273.15) / nominalK),
    x2: 1 / (sample.temperature + 273.15) - 1 / nominalK,
    y: Math.log(sample.is / reference.is)
  }));
  const ideality = median(samples.map(sample => sample.n));

  // Two curves cannot independently identify EG and XTI. Constrain EG to the
  // common silicon value and solve only XTI; three or more curves fit both.
  if (groups.size === 2) {
    const eg = 1.11;
    const xtiValues = rows
      .filter(row => Math.abs(row.x1) > 1e-20)
      .map(row => ideality * (row.y + eg * row.x2 / (ideality * BOLTZMANN_EV)) / row.x1);
    return {
      parameters: { EG: format(eg), XTI: format(median(xtiValues)), TNOM: format(reference.temperature) },
      warning: "2温度のためEG=1.11 eVに固定してXTIを推定しました。"
    };
  }

  const a11 = rows.reduce((sum, row) => sum + row.x1 ** 2, 0);
  const a12 = rows.reduce((sum, row) => sum + row.x1 * row.x2, 0);
  const a22 = rows.reduce((sum, row) => sum + row.x2 ** 2, 0);
  const b1 = rows.reduce((sum, row) => sum + row.x1 * row.y, 0);
  const b2 = rows.reduce((sum, row) => sum + row.x2 * row.y, 0);
  const determinant = a11 * a22 - a12 * a12;
  if (Math.abs(determinant) < 1e-20) throw new Error("温度点の組み合わせから温度係数を推定できません。");

  const coefficient1 = (b1 * a22 - b2 * a12) / determinant;
  const coefficient2 = (a11 * b2 - a12 * b1) / determinant;
  return {
    parameters: {
      EG: format(-coefficient2 * ideality * BOLTZMANN_EV),
      XTI: format(coefficient1 * ideality),
      TNOM: format(reference.temperature)
    }
  };
}

function result(parameters = {}, curves = [], errors = [], warnings = [], parameterSources = {}) {
  const error = errors.length
    ? Math.sqrt(errors.reduce((sum, value) => sum + value ** 2, 0) / errors.length)
    : 0;
  return { parameters, curves, error, warnings, parameterSources };
}

function mergeOptional(target, fitted, curve, source) {
  Object.assign(target.parameters, fitted.parameters);
  target.curves.push(curve);
  if (fitted.error != null) target.errors.push(fitted.error);
  for (const parameter of Object.keys(fitted.parameters)) target.parameterSources[parameter] = source;
}

function fitDiode(data, temperature) {
  const points = parseCsvPoints(data.iv, ["VF", "IF"]);
  const basic = fitDiodeJunction(points, "VF", "IF", temperature);
  const state = {
    parameters: basic.parameters,
    curves: [{ name: "IF-VF", columns: ["VF", "IF"], points }],
    errors: [basic.error], warnings: [], parameterSources: {}
  };
  for (const parameter of Object.keys(basic.parameters)) state.parameterSources[parameter] = "IF-VF";

  if (hasData(data.cjVr)) {
    const optionalPoints = parseCsvPoints(data.cjVr, ["VR", "CJ"]);
    mergeOptional(state, fitDepletionCapacitance(optionalPoints, "VR", "CJ", {
      capacitance: "CJO", potential: "VJ", grading: "M"
    }), { name: "Cj-VR", columns: ["VR", "CJ"], points: optionalPoints }, "Cj-VR");
  }
  if (hasData(data.temperatureIv)) {
    const optionalPoints = parseTemperaturePoints(data.temperatureIv, {
      xKey: "VF", yKey: "IF", temperatures: data.temperatureIvTemperatures, yUnit: data.temperatureIvUnit
    });
    const temperatureFit = fitTemperatureJunction(optionalPoints, "VF", "IF", temperature);
    mergeOptional(state, temperatureFit, {
      name: "IF-VF @ temperature", columns: ["TEMP", "VF", "IF"], points: optionalPoints
    }, "IF-VF @ multiple temperatures");
    if (temperatureFit.warning) state.warnings.push(temperatureFit.warning);
  }
  if (hasData(data.reverseRecovery)) {
    const optionalPoints = parseCsvPoints(data.reverseRecovery, ["IR", "TRR"]);
    mergeOptional(state, { parameters: { TT: format(median(optionalPoints.map(point => point.TRR))) } }, {
      name: "Reverse recovery", columns: ["IR", "TRR"], points: optionalPoints
    }, "Reverse recovery");
  }
  return result(state.parameters, state.curves, state.errors, state.warnings, state.parameterSources);
}

function fitBjt(data, temperature) {
  const state = { parameters: {}, curves: [], errors: [], warnings: [], parameterSources: {} };
  const gains = [];

  if (hasData(data.vbeIc)) {
    const points = parseCsvPoints(data.vbeIc, ["VBE", "IC"]);
    const fit = fitJunction(points, "VBE", "IC", temperature);
    mergeOptional(state, fit, { name: "VBE-IC", columns: ["VBE", "IC"], points }, "VBE-IC");
  }
  if (hasData(data.gummel)) {
    const points = parseCsvPoints(data.gummel, ["VBE", "IC", "IB"]);
    const fit = fitJunction(points, "VBE", "IC", temperature);
    mergeOptional(state, fit, { name: "Gummel VBE-IC-IB", columns: ["VBE", "IC", "IB"], points }, "Gummel");
    gains.push(...points.filter(point => point.IB > 0 && point.IC > 0).map(point => ({ IC: point.IC, hFE: point.IC / point.IB })));
  }
  if (hasData(data.hfeIc)) {
    const points = parseCsvPoints(data.hfeIc, ["IC", "hFE"]);
    gains.push(...points.filter(point => point.IC > 0 && point.hFE > 0));
    state.curves.push({ name: "hFE-IC", columns: ["IC", "hFE"], points });
  }
  if (hasData(data.icIb)) {
    const points = parseCsvPoints(data.icIb, ["IB", "IC"]);
    gains.push(...points.filter(point => point.IB > 0 && point.IC > 0).map(point => ({ IC: point.IC, hFE: point.IC / point.IB })));
    state.curves.push({ name: "IC-IB", columns: ["IB", "IC"], points });
  }
  if (gains.length) {
    const bf = Math.max(...gains.map(point => point.hFE));
    state.parameters.BF = format(bf);
    state.parameterSources.BF = state.curves.some(curve => curve.name === "hFE-IC") ? "hFE-IC" : "IC-IB/Gummel";
    const candidates = gains
      .filter(point => point.hFE < bf * 0.95)
      .map(point => point.IC / (bf / point.hFE - 1))
      .filter(value => value > 0 && Number.isFinite(value));
    if (candidates.length) {
      state.parameters.IKF = format(median(candidates));
      state.parameterSources.IKF = "high-current hFE roll-off";
    }
  }

  if (!state.parameters.IS) state.warnings.push("VBE-ICデータがないためIS/Nは設定しません。");
  if (!state.parameters.BF) state.warnings.push("hFE-ICまたはIC-IBデータがないためBFは設定しません。");
  if (!state.curves.length) throw new Error("BJTはVBE-IC、hFE-IC、IC-IBのいずれかを入力してください。");

  if (hasData(data.junctionCapacitance)) {
    const points = parseCsvPoints(data.junctionCapacitance, ["VCB", "CJC"]);
    mergeOptional(state, fitDepletionCapacitance(points, "VCB", "CJC", {
      capacitance: "CJC", potential: "VJC", grading: "MJC"
    }), { name: "CJC-VCB", columns: ["VCB", "CJC"], points }, "CJC-VCB");
  }
  if (hasData(data.temperatureIc)) {
    const points = parseTemperaturePoints(data.temperatureIc, {
      xKey: "VBE", yKey: "IC", temperatures: data.temperatureIcTemperatures, yUnit: data.temperatureIcUnit
    });
    const temperatureFit = fitTemperatureJunction(points, "VBE", "IC", temperature);
    mergeOptional(state, temperatureFit, {
      name: "VBE-IC @ temperature", columns: ["TEMP", "VBE", "IC"], points
    }, "VBE-IC @ multiple temperatures");
    if (temperatureFit.warning) state.warnings.push(temperatureFit.warning);
  }
  if (hasData(data.transitionFrequency)) {
    const points = parseCsvPoints(data.transitionFrequency, ["IC", "FT"]);
    const tf = median(points.filter(point => point.FT > 0).map(point => 1 / (2 * Math.PI * point.FT)));
    mergeOptional(state, { parameters: { TF: format(tf) } }, {
      name: "fT-IC", columns: ["IC", "FT"], points
    }, "fT-IC");
  }
  return result(state.parameters, state.curves, state.errors, state.warnings, state.parameterSources);
}

function fitMosfetTransfer(points) {
  const valid = points
    .filter(point => Math.abs(point.ID) > 0)
    .map(point => ({ x: Math.abs(point.VGS), y: Math.sqrt(Math.abs(point.ID)) }));
  const fit = linearFit(valid);
  return { parameters: { VTO: format(-fit.intercept / fit.slope), KP: format(2 * fit.slope ** 2) }, error: fit.rmse };
}

function fitMosfet(data, temperature) {
  const points = parseCsvPoints(data.transfer, ["VGS", "ID"]);
  const basic = fitMosfetTransfer(points);
  const state = {
    parameters: basic.parameters,
    curves: [{ name: "Transfer VGS-ID", columns: ["VGS", "ID"], points }],
    errors: [basic.error], warnings: [],
    parameterSources: { VTO: "VGS-ID", KP: "VGS-ID" }
  };

  if (hasData(data.outputCapacitance)) {
    const optionalPoints = parseCsvPoints(data.outputCapacitance, ["VDS", "CISS", "COSS", "CRSS"]);
    const cgd = median(optionalPoints.map(point => point.CRSS));
    const cgs = median(optionalPoints.map(point => point.CISS - point.CRSS).filter(value => value > 0));
    const cbd = median(optionalPoints.map(point => point.COSS - point.CRSS).filter(value => value > 0));
    mergeOptional(state, { parameters: { CGS: format(cgs), CGD: format(cgd), CBD: format(cbd) } }, {
      name: "CISS/COSS/CRSS-VDS", columns: ["VDS", "CISS", "COSS", "CRSS"], points: optionalPoints
    }, "CISS/COSS/CRSS-VDS");
  }
  if (hasData(data.temperatureTransfer)) {
    const optionalPoints = parseTemperaturePoints(data.temperatureTransfer, {
      xKey: "VGS", yKey: "ID", temperatures: data.temperatureTransferTemperatures, yUnit: data.temperatureTransferUnit
    });
    const groups = groupBy(optionalPoints, "TEMP");
    if (groups.size < 2) throw new Error("MOSFET温度特性は2温度以上のデータを入力してください。");
    const samples = [...groups].map(([sampleTemperature, samplePoints]) => ({
      temperature: sampleTemperature,
      ...fitMosfetTransfer(samplePoints).parameters
    }));
    const nominal = samples.reduce((best, sample) => (
      Math.abs(sample.temperature - temperature) < Math.abs(best.temperature - temperature) ? sample : best
    ));
    const thresholdFit = linearFit(samples.map(sample => ({
      x: sample.temperature - nominal.temperature,
      y: Number(sample.VTO)
    })));
    const mobilityFit = linearFit(samples.map(sample => ({
      x: Math.log((sample.temperature + 273.15) / (nominal.temperature + 273.15)),
      y: Math.log(Number(sample.KP))
    })));
    mergeOptional(state, { parameters: {
      VTO: nominal.VTO,
      KP: nominal.KP,
      TCV: format(thresholdFit.slope),
      BEX: format(mobilityFit.slope),
      TNOM: format(nominal.temperature)
    } }, {
      name: "VGS-ID @ temperature", columns: ["TEMP", "VGS", "ID"], points: optionalPoints
    }, "VGS-ID @ multiple temperatures");
  }
  if (hasData(data.gateCharge)) {
    const optionalPoints = parseCsvPoints(data.gateCharge, ["VGS", "QG"]);
    const chargeFit = linearFit(optionalPoints.map(point => ({ x: point.VGS, y: point.QG })));
    mergeOptional(state, { parameters: { CGS: format(Math.abs(chargeFit.slope)) }, error: chargeFit.rmse }, {
      name: "QG-VGS", columns: ["VGS", "QG"], points: optionalPoints
    }, "QG-VGS");
  }
  return result(state.parameters, state.curves, state.errors, state.warnings, state.parameterSources);
}

function fitPhoto(data, temperature) {
  const state = { parameters: {}, curves: [], errors: [], warnings: [], parameterSources: {} };
  if (hasData(data.transfer)) {
    const points = parseCsvPoints(data.transfer, ["IF", "IC"]);
    const ratios = points.filter(point => point.IF > 0).map(point => point.IC / point.IF);
    state.parameters.CTR = format(ratios.reduce((a, b) => a + b, 0) / ratios.length);
    state.parameterSources.CTR = "IF-IC";
    state.curves.push({ name: "IF-IC", columns: ["IF", "IC"], points });
  }
  if (hasData(data.ifCtr)) {
    const points = parseCsvPoints(data.ifCtr, ["IF", "CTR"]);
    state.parameters.CTR = format(points.reduce((sum, point) => sum + point.CTR, 0) / points.length);
    state.parameterSources.CTR = "IF-CTR table";
    state.curves.push({ name: "IF-CTR", columns: ["IF", "CTR"], points });
  }
  if (hasData(data.led)) {
    const points = parseCsvPoints(data.led, ["VF", "IF"]);
    mergeOptional(state, fitDiodeJunction(points, "VF", "IF", temperature), {
      name: "LED IF-VF", columns: ["VF", "IF"], points
    }, "LED IF-VF");
  } else {
    state.warnings.push("LED IF-VFデータがないため入力LEDのIS/N/RSは設定しません。");
  }
  if (!state.parameters.CTR) throw new Error("PhotoCouplerはIF-CTRまたはIF-ICを入力してください。");

  if (hasData(data.couplingCapacitance)) {
    const points = parseCsvPoints(data.couplingCapacitance, ["VCE", "CCE"]);
    mergeOptional(state, { parameters: { CCE: format(median(points.map(point => point.CCE))) } }, {
      name: "CCE-VCE", columns: ["VCE", "CCE"], points
    }, "CCE-VCE");
  }
  if (hasData(data.temperatureCtr)) {
    const points = parseTemperaturePoints(data.temperatureCtr, {
      xKey: "IF", yKey: "CTR", temperatures: data.temperatureCtrTemperatures, yUnit: "ratio"
    });
    const fit = linearFit(points.map(point => ({ x: point.TEMP - temperature, y: point.CTR })));
    mergeOptional(state, { parameters: { CTRTC: format(fit.slope), TNOM: format(temperature) }, error: fit.rmse }, {
      name: "IF-CTR @ temperature", columns: ["TEMP", "IF", "CTR"], points
    }, "IF-CTR @ multiple temperatures");
  }
  if (hasData(data.responseTime)) {
    const points = parseCsvPoints(data.responseTime, ["RL", "TR", "TF"]);
    const cce = median(points.filter(point => point.RL > 0).map(point => (point.TR + point.TF) / (4.4 * point.RL)));
    mergeOptional(state, { parameters: { CCE: format(cce) } }, {
      name: "tr/tf-RL", columns: ["RL", "TR", "TF"], points
    }, "tr/tf-RL");
  }
  return result(state.parameters, state.curves, state.errors, state.warnings, state.parameterSources);
}

function fitCharacteristics(variant, data, temperature = 27) {
  if (variant === "Diode") return fitDiode(data, temperature);
  if (variant.startsWith("BJT")) return fitBjt(data, temperature);
  if (variant.startsWith("MOSFET")) return fitMosfet(data, temperature);
  return fitPhoto(data, temperature);
}

// src/ltspice/modelWriter.js
const defaults = {
  Diode: { IS: "1e-14", N: "1", RS: "0.1" },
  BJT: { IS: "1e-14", BF: "100", VAF: "100" },
  MOSFET: { VTO: "2", KP: "1", LAMBDA: "0.01", RD: "10m", RS: "10m" }
};

function paramsText(params) {
  return Object.entries(params).filter(([, value]) => value !== "" && value != null)
    .map(([key, value]) => `${key.toUpperCase()}=${value}`).join(" ");
}

function writeModel(model) {
  assertDeviceModel(model);
  const p = { ...(defaults[model.deviceType] || {}), ...model.spiceParameters };
  const header = `* ${model.deviceName} - generated by LTspice Model Package Generator\n* Tnom=${model.temperature} degC`;
  if (model.modelType === "MODEL") {
    return `${header}\n.model ${model.deviceName} ${model.polarity}(${paramsText(p)})\n`;
  }
  const ports = model.pins.map(pin => pin.name).join(" ");
  if (model.deviceType === "MOSFET") {
    const internal = `${model.deviceName}__CORE`;
    return `${header}\n.SUBCKT ${model.deviceName} ${ports}\nM1 D G S S ${internal}\n.model ${internal} ${model.polarity}(${paramsText(p)})\n.ENDS ${model.deviceName}\n`;
  }
  const ctr = p.CTR ?? "1";
  const ctrCurve=model.characteristicCurves.find(curve=>curve.name==="IF-CTR");
  const baseCtrExpression=ctrCurve?.points?.length
    ? `table(max(I(DLED),0), ${ctrCurve.points.slice().sort((a,b)=>a.IF-b.IF).map(point=>`${point.IF},${point.CTR}`).join(", ")})`
    : ctr;
  const ctrExpression = p.CTRTC
    ? `(${baseCtrExpression}+${p.CTRTC}*(temp-${p.TNOM ?? model.temperature}))`
    : baseCtrExpression;
  const diode = paramsText({ IS: p.IS ?? "1e-14", N: p.N ?? "1.5", RS: p.RS ?? "1" });
  const outputCapacitance = p.CCE ? `\nCCE C E ${p.CCE}` : "";
  return `${header}\n.SUBCKT ${model.deviceName} ${ports}\nDLED A K ${model.deviceName}__LED\nBPHOTO C E I={${ctrExpression}*max(I(DLED),0)}\nRCE C E 1G${outputCapacitance}\n.model ${model.deviceName}__LED D(${diode})\n.ENDS ${model.deviceName}\n`;
}

const symbolGeometry = {

const symbolPinLocations={diode:[[16,0],[16,64]],npn:[[64,0],[0,48],[64,96]],pnp:[[64,0],[0,48],[64,96]],nmos:[[48,0],[0,80],[48,96]],pmos:[[48,0],[0,80],[48,96]],"opto-coupler":[[-96,-48],[-96,48],[96,-48],[96,48]]};

function writeSymbol(model) {
  assertDeviceModel(model);const base=model.symbolBase,lines=["Version 4","SymbolType CELL",...symbolGeometry[base],`SYMATTR Value ${model.deviceName}`,`SYMATTR Prefix ${model.symbolPrefix}`,`SYMATTR ModelFile ${model.deviceName}.lib`,`SYMATTR Description ${model.variant} generated from LTspice ${base} symbol`];
  model.pins.forEach((p,index)=>{const [x,y]=symbolPinLocations[base][index];lines.push(`PIN ${x} ${y} NONE 0`,`PINATTR PinName ${p.name}`,`PINATTR SpiceOrder ${p.spiceOrder}`);});
  return [...lines,""].join("\n");
}

// src/ltspice/ascWriter.js
const HEADER = ["Version 4", "SHEET 1 880 680"];

const wire = (x1, y1, x2, y2) => `WIRE ${x1} ${y1} ${x2} ${y2}`;
const flag = (x, y, name) => `FLAG ${x} ${y} ${name}`;
const text = (x, y, value) => `TEXT ${x} ${y} Left 2 !${value}`;

function symbol(name, x, y, instanceName, value) {
  return [
    `SYMBOL ${name} ${x} ${y} R0`,
    `SYMATTR InstName ${instanceName}`,
    `SYMATTR Value ${value}`
  ];
}

function finish(model, lines) {
  // An explicit include makes the generated test circuit independent of
  // whether a particular LTspice version honors the symbol's ModelFile field.
  return [
    ...HEADER,
    ...lines,
    text(480, 400, `.include ${model.deviceName}.lib`),
    ""
  ].join("\n");
}

// Keep this layout aligned with the supplied D_test.asc reference circuit.
function writeDiodeTest(model) {
  return finish(model, [
    wire(288, 128, 160, 128),
    wire(480, 128, 368, 128),
    wire(160, 176, 160, 128),
    wire(480, 176, 480, 128),
    wire(160, 272, 160, 256),
    wire(480, 272, 480, 240),
    wire(480, 272, 160, 272),
    wire(160, 288, 160, 272),
    flag(160, 288, "0"),
    ...symbol(model.deviceName, 464, 176, "D1", model.deviceName),
    ...symbol("voltage", 160, 160, "V1", "0"),
    "SYMBOL res 384 112 R90",
    "WINDOW 0 0 56 VBottom 2",
    "WINDOW 3 32 56 VTop 2",
    "SYMATTR InstName R1",
    "SYMATTR Value 10m",
    text(96, 320, ".dc V1 0 2 1m"),
    text(96, 352, ".meas DC IF FIND I(D1) AT=1")
  ]);
}

// P-type devices reuse the same fixture; signed sweeps reverse the bias.
function writeBjtTest(model) {
  const isPnp = model.polarity === "PNP";
  const sweep = isPnp
    ? ".dc VCE 0 -10 -0.1 VB 0 -1 -0.05"
    : ".dc VCE 0 10 0.1 VB 0 1 0.05";
  const plotCurrent = isPnp ? "I(VCE)" : "-I(VCE)";

  return finish(model, [
    wire(416, 64, 160, 64),
    wire(160, 112, 160, 64),
    wire(416, 112, 416, 64),
    wire(352, 160, 240, 160),
    wire(160, 256, 160, 192),
    wire(240, 256, 240, 240),
    wire(240, 256, 160, 256),
    wire(416, 256, 416, 208),
    wire(416, 256, 240, 256),
    wire(160, 272, 160, 256),
    flag(160, 272, "0"),
    ...symbol(model.deviceName, 352, 112, "Q1", model.deviceName),
    ...symbol("voltage", 160, 96, "VCE", "0"),
    ...symbol("voltage", 240, 144, "VB", "0"),
    text(96, 304, sweep),
    text(96, 336, `;Plot ${plotCurrent} for Ic-Vce curves`)
  ]);
}

function writeMosfetTest(model) {
  const isPmos = model.polarity === "PMOS";
  const sweep = isPmos
    ? ".dc VDS 0 -10 -0.1 VGS 0 -10 -1"
    : ".dc VDS 0 10 0.1 VGS 0 10 1";
  const plotCurrent = isPmos ? "I(VDS)" : "-I(VDS)";
  const instanceName = model.modelType === "SUBCKT" ? "X1" : "M1";

  return finish(model, [
    wire(400, 64, 160, 64),
    wire(160, 112, 160, 64),
    wire(400, 112, 400, 64),
    wire(352, 192, 240, 192),
    wire(160, 288, 160, 192),
    wire(240, 288, 240, 272),
    wire(240, 288, 160, 288),
    wire(400, 288, 400, 208),
    wire(400, 288, 240, 288),
    wire(160, 304, 160, 288),
    flag(160, 304, "0"),
    ...symbol(model.deviceName, 352, 112, instanceName, model.deviceName),
    ...symbol("voltage", 160, 96, "VDS", "0"),
    ...symbol("voltage", 240, 176, "VGS", "0"),
    text(96, 336, sweep),
    text(96, 368, `;Plot ${plotCurrent} for Id-Vds curves`)
  ]);
}

function writePhotoCouplerTest(model) {
  return finish(model, [
    wire(288, 128, 160, 128),
    wire(592, 128, 480, 128),
    wire(160, 256, 160, 208),
    wire(288, 256, 288, 224),
    wire(288, 256, 160, 256),
    wire(480, 256, 480, 224),
    wire(480, 256, 288, 256),
    wire(592, 256, 592, 208),
    wire(592, 256, 480, 256),
    flag(160, 256, "0"),
    ...symbol(model.deviceName, 384, 176, "X1", model.deviceName),
    ...symbol("current", 160, 128, "IIN", "0"),
    ...symbol("voltage", 592, 112, "VCC", "5"),
    text(96, 320, ".dc IIN 0 -20m -0.1m"),
    text(96, 352, ";IF=-I(IIN), IC=-I(VCC), CTR=I(VCC)/I(IIN)")
  ]);
}

function writeTestSchematic(model) {
  assertDeviceModel(model);

  if (model.deviceType === "Diode") return writeDiodeTest(model);
  if (model.deviceType === "BJT") return writeBjtTest(model);
  if (model.deviceType === "MOSFET") return writeMosfetTest(model);
  return writePhotoCouplerTest(model);
}

// src/export/jsonWriter.js
function writeJson(model) {
  return JSON.stringify(model, null, 2) + "\n";
}

// src/export/readmeWriter.js
function writeReadme(model) {
  const pins = model.pins.map(pin => `${pin.spiceOrder} : ${pin.name}`).join("\n");
  const curves = model.characteristicCurves.length
    ? model.characteristicCurves.map((curve, i) => `${i + 1}. ${curve.name || curve.type || "characteristic data"}`).join("\n")
    : "特性曲線データは登録されていません。";
  const sources=Object.keys(model.parameterSources||{}).length?Object.entries(model.parameterSources).map(([key,value])=>`${key}: ${value}`).join("\n"):"自動推定元なし（既定値または手動値）";
  const warnings=model.fittingWarnings?.length?model.fittingWarnings.map(value=>`- ${value}`).join("\n"):"なし";
  return `${model.deviceName} LTspice Model Package
========================================

1. LTspiceでの使い方
このフォルダ内の ${model.deviceName}_test.asc をLTspiceで開き、Runを実行してください。
新しい回路で使う場合は、.ascと同じフォルダに ${model.deviceName}.asy と ${model.deviceName}.lib を置き、Place ComponentのSchematic Directoryから ${model.deviceName} を配置します。
別フォルダへ恒久登録する場合は、LTspiceのSymbol Search PathsとSimulation Library Search Pathsを設定してください。

2. 各ファイルの説明
${model.deviceName}.lib : SPICEモデル本体
${model.deviceName}.asy : モデルに紐づいたLTspiceシンボル
${model.deviceName}_test.asc : 特性確認用テスト回路
model.json : 生成条件・元データ・精度情報
README.txt : この説明書

3. Pin Assign（SPICE端子順）
${pins}

4. 使用した特性データ
${curves}

5. モデルの精度
Fitting error: ${model.fittingError ?? "未評価"}
Temperature: ${model.temperature} degC
Parameter sources:
${sources}
Fitting warnings:
${warnings}

6. 注意事項
本モデルは入力された特性とパラメータに基づく近似です。実機の全動作領域、絶対最大定格、ばらつきを保証しません。
シンボルのSpiceOrderとモデル端子順はmodel.jsonのpinsから共通生成されています。端子順を個別に変更しないでください。
Generator version: ${model.generatorVersion}
Generated at: ${model.generatedAt}
`;
}

// src/export/zipWriter.js
const encoder = new TextEncoder();
let crcTable;
function makeCrcTable() {
  return Array.from({ length: 256 }, (_, n) => {
    let c=n; for(let k=0;k<8;k++) c=(c&1)?0xedb88320^(c>>>1):c>>>1; return c>>>0;
  });
}
function crc32(bytes) {
  crcTable ||= makeCrcTable(); let c=0xffffffff;
  for (const b of bytes) c=crcTable[(c^b)&0xff]^(c>>>8);
  return (c^0xffffffff)>>>0;
}
function u16(n){ return [n&255,(n>>>8)&255]; }
function u32(n){ return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]; }
function dosDateTime(date=new Date()) {
  const year=Math.max(1980,date.getFullYear());
  return { time:(date.getHours()<<11)|(date.getMinutes()<<5)|(date.getSeconds()>>>1), date:((year-1980)<<9)|((date.getMonth()+1)<<5)|date.getDate() };
}

function createZip(files, date=new Date()) {
  const local=[], central=[]; let offset=0; const dt=dosDateTime(date);
  for (const [path, content] of Object.entries(files)) {
    const name=encoder.encode(path.replace(/\\/g,"/")); const data=typeof content==="string"?encoder.encode(content):content; const crc=crc32(data);
    const localHeader=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(dt.time),...u16(dt.date),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...name]);
    local.push(localHeader,data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(dt.time),...u16(dt.date),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...name]));
    offset+=localHeader.length+data.length;
  }
  const centralSize=central.reduce((n,b)=>n+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(central.length),...u16(central.length),...u32(centralSize),...u32(offset),...u16(0)]);
  const all=[...local,...central,end], size=all.reduce((n,b)=>n+b.length,0), out=new Uint8Array(size); let at=0;
  for(const bytes of all){out.set(bytes,at);at+=bytes.length;} return out;
}

// src/ltspice/packageWriter.js
function buildPackage(model) {
  assertDeviceModel(model);
  const root=`${model.deviceName}_LTspice/`;
  const files={
    [`${root}${model.deviceName}.lib`]: writeModel(model),
    [`${root}${model.deviceName}.asy`]: writeSymbol(model),
    [`${root}${model.deviceName}_test.asc`]: writeTestSchematic(model),
    [`${root}model.json`]: writeJson(model),
    [`${root}README.txt`]: writeReadme(model)
  };
  return { fileName: `${model.deviceName}_LTspice.zip`, files, bytes: createZip(files, new Date(model.generatedAt)) };
}

// src/app.js
const byId = id => document.getElementById(id);
const variantSelect = byId("variant");

for (const value of deviceOptions) {
  const option = document.createElement("option");
  option.value = value;
  option.textContent = value;
  variantSelect.append(option);
}
variantSelect.value = "PhotoCoupler";

const SVG_NAMESPACE = "http://www.w3.org/2000/svg";

function svgElement(name, attributes = {}) {
  const element = document.createElementNS(SVG_NAMESPACE, name);
  for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, value);
  return element;
}

function renderSymbolPreview(variant) {
  const preview = byId("model-preview");
  const model = createDeviceModel({ deviceName: "DEVICE", variant, generatedAt: "preview" });
  const commands = symbolGeometry[model.symbolBase];
  const pins = symbolPinLocations[model.symbolBase];
  const coordinates = pins.flat();

  for (const command of commands) {
    const parts = command.split(/\s+/);
    if (parts[0] === "LINE") coordinates.push(...parts.slice(2, 6).map(Number));
    if (parts[0] === "RECTANGLE") coordinates.push(...parts.slice(2, 6).map(Number));
  }
  const xs = coordinates.filter((_, index) => index % 2 === 0);
  const ys = coordinates.filter((_, index) => index % 2 === 1);
  const minX = Math.min(...xs) - 34;
  const minY = Math.min(...ys) - 26;
  const width = Math.max(...xs) - minX + 34;
  const height = Math.max(...ys) - minY + 26;
  const svg = svgElement("svg", {
    viewBox: `${minX} ${minY} ${width} ${height}`,
    role: "img",
    "aria-label": `${variant} LTspice symbol`
  });

  for (const command of commands) {
    const parts = command.split(/\s+/);
    if (parts[0] === "LINE") {
      const [x1, y1, x2, y2] = parts.slice(2, 6);
      svg.append(svgElement("line", { x1, y1, x2, y2 }));
    } else if (parts[0] === "RECTANGLE") {
      const [x1, y1, x2, y2] = parts.slice(2, 6).map(Number);
      svg.append(svgElement("rect", {
        x: Math.min(x1, x2), y: Math.min(y1, y2),
        width: Math.abs(x2 - x1), height: Math.abs(y2 - y1)
      }));
    }
  }

  model.pins.forEach((pin, index) => {
    const [x, y] = pins[index];
    svg.append(svgElement("rect", { x: x - 2, y: y - 2, width: 4, height: 4, class: "pin-marker" }));
    const label = svgElement("text", {
      x: x < 0 ? x + 6 : x - 6,
      y: y - 6,
      "text-anchor": x < 0 ? "start" : "end"
    });
    label.textContent = `${pin.spiceOrder}:${pin.name}`;
    svg.append(label);
  });

  const title = document.createElement("strong");
  title.textContent = variant;
  const details = document.createElement("span");
  details.textContent = `${model.modelType === "MODEL" ? ".MODEL" : ".SUBCKT"} / Prefix ${model.symbolPrefix}`;
  const pinText = document.createElement("code");
  pinText.textContent = model.pins.map(pin => `${pin.spiceOrder}:${pin.name}`).join(" · ");
  preview.replaceChildren(svg, title, details, pinText);
}

function initializeModelPicker() {
  const picker = byId("model-picker");
  const button = byId("model-picker-button");
  const popover = byId("model-picker-popover");
  const options = byId("model-picker-options");

  const close = ({ restoreFocus = false } = {}) => {
    popover.hidden = true;
    button.setAttribute("aria-expanded", "false");
    if (restoreFocus) button.focus();
  };
  const open = () => {
    popover.hidden = false;
    button.setAttribute("aria-expanded", "true");
    renderSymbolPreview(variantSelect.value);
    for (const option of options.querySelectorAll("[data-model-option]")) {
      option.setAttribute("aria-selected", String(option.dataset.modelOption === variantSelect.value));
    }
    options.querySelector(`[data-model-option="${variantSelect.value}"]`)?.focus();
  };
  const selectVariant = variant => {
    variantSelect.value = variant;
    button.textContent = variant;
    variantSelect.dispatchEvent(new Event("change"));
    close({ restoreFocus: true });
  };

  for (const variant of deviceOptions) {
    const option = document.createElement("button");
    option.type = "button";
    option.className = "model-picker-option";
    option.dataset.modelOption = variant;
    option.setAttribute("role", "option");
    option.textContent = variant;
    option.addEventListener("pointerenter", () => renderSymbolPreview(variant));
    option.addEventListener("focus", () => renderSymbolPreview(variant));
    option.addEventListener("click", () => selectVariant(variant));
    option.addEventListener("keydown", event => {
      const all = [...options.querySelectorAll("[data-model-option]")];
      const index = all.indexOf(option);
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        const direction = event.key === "ArrowDown" ? 1 : -1;
        all[(index + direction + all.length) % all.length].focus();
      } else if (event.key === "Escape") {
        close({ restoreFocus: true });
      }
    });
    options.append(option);
  }

  button.textContent = variantSelect.value;
  button.addEventListener("click", () => popover.hidden ? open() : close());
  button.addEventListener("keydown", event => {
    if (["ArrowDown", "Enter", " "].includes(event.key) && popover.hidden) {
      event.preventDefault();
      open();
    }
  });
  document.addEventListener("pointerdown", event => {
    if (!popover.hidden && !picker.contains(event.target)) close();
  });
}

// Basic and advanced variants share the same characteristic input fields.
function characteristicGroup(variant) {
  if (variant.startsWith("BJT")) return "BJT";
  if (variant.startsWith("MOSFET")) return "MOSFET";
  return variant;
}

function renderFields() {
  byId("fit-output").textContent = "未フィッティング";
  const container = byId("characteristic-fields");
  container.replaceChildren();

  const fields = characteristicInputs[characteristicGroup(variantSelect.value)];
  const stageLabels = {
    basic: "Basic parameters",
    temperature: "Optional: 温度特性",
    capacitance: "Optional: 容量特性",
    switching: "Optional: スイッチング特性"
  };
  let currentStage;

  for (const field of fields) {
    if (field.stage !== currentStage) {
      currentStage = field.stage;
      const heading = document.createElement("h3");
      heading.className = "characteristic-stage";
      heading.textContent = stageLabels[currentStage];
      container.append(heading);
    }
    const label = document.createElement("label");
    const hint = document.createElement("small");
    const area = document.createElement("textarea");
    const swapLabel = document.createElement("label");
    const swap = document.createElement("input");

    hint.textContent = `${field.hint}（空白・タブで区切る。改行位置は任意）`;
    area.rows = 5;
    area.dataset.characteristic = field.key;
    area.dataset.columns = field.columns || 2;
    area.value = field.sample;
    swap.type = "checkbox";
    swap.dataset.swap = field.key;
    swapLabel.className = "swap-control";
    swapLabel.append(swap, " X/Yを入れ替える");

    label.append(field.label, hint, area);

    if (field.stage === "temperature") {
      const options = document.createElement("div");
      const temperatures = document.createElement("input");
      temperatures.type = "text";
      temperatures.placeholder = "Y1, Y2...の温度（例: 25, 65, 105）";
      temperatures.dataset.temperatureSeries = field.key;
      options.className = "temperature-options";
      options.append(temperatures);

      if (field.yQuantity !== "ratio") {
        const unit = document.createElement("select");
        unit.dataset.temperatureUnit = field.key;
        for (const value of ["A", "mA", "uA"]) {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = `Y軸: ${value}`;
          unit.append(option);
        }
        unit.value = "A";
        options.append(unit);
      }
      label.append(options);
    } else {
      label.append(swapLabel);
    }
    container.append(label);
  }
}

function collectData() {
  const fields = document.querySelectorAll("[data-characteristic]");
  const entries = [...fields].flatMap(element => {
    const key = element.dataset.characteristic;
    const swap = document.querySelector(`[data-swap="${key}"]`);
    const value = swap?.checked
      ? swapSeriesXY(element.value, Number(element.dataset.columns))
      : element.value;
    const temperatures = document.querySelector(`[data-temperature-series="${key}"]`);
    const unit = document.querySelector(`[data-temperature-unit="${key}"]`);
    return [
      [key, value],
      ...(temperatures ? [[`${key}Temperatures`, temperatures.value]] : []),
      ...(unit ? [[`${key}Unit`, unit.value]] : [])
    ];
  });
  return Object.fromEntries(entries);
}

function runFit() {
  const fit = fitCharacteristics(
    variantSelect.value,
    collectData(),
    Number(byId("temperature").value)
  );
  const warning = fit.warnings?.length
    ? ` / 注意: ${fit.warnings.join(" ")}`
    : "";

  byId("fit-output").textContent =
    `推定値: ${JSON.stringify(fit.parameters)} / ` +
    `RMSE: ${fit.error.toPrecision(4)}${warning}`;
  return fit;
}

variantSelect.addEventListener("change", renderFields);
initializeModelPicker();
byId("fit-button").addEventListener("click", () => {
  try {
    runFit();
  } catch (error) {
    byId("fit-output").textContent = error.message;
  }
});
renderFields();

byId("model-form").addEventListener("submit", event => {
  event.preventDefault();
  const status = byId("status");

  try {
    const fit = runFit();
    const overrides = JSON.parse(byId("parameters").value || "{}");
    const model = createDeviceModel({
      deviceName: byId("device-name").value,
      variant: variantSelect.value,
      temperature: byId("temperature").value,
      fittingError: fit.error,
      fittingWarnings: fit.warnings,
      parameterSources: fit.parameterSources,
      spiceParameters: { ...fit.parameters, ...overrides },
      characteristicCurves: fit.curves
    });

    // Build the package in memory, then hand it to the browser as a download.
    const pkg = buildPackage(model);
    const blob = new Blob([pkg.bytes], { type: "application/zip" });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = pkg.fileName;
    anchor.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    status.textContent = `${pkg.fileName} を生成しました`;
  } catch (error) {
    status.textContent = error.message;
  }
});
})();
